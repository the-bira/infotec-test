<div class="dashboard-container">
  <!-- Barra de Navegação Superior -->
  <header class="navbar">
    <div class="navbar-brand">
      <span class="logo-text">Aivacol Fleet</span>
    </div>
    <div class="navbar-user">
      <a routerLink="/vehicles" class="back-link">&larr; Voltar para a Frota</a>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <div class="form-card">
      <h1 class="form-title">{{ isEditMode ? 'Editar Veículo' : 'Cadastrar Veículo' }}</h1>
      <p class="form-subtitle">Preencha as informações abaixo para gerenciar a frota</p>

      <!-- Indicador de Carregamento -->
      <div *ngIf="isLoading" class="loader-container">
        <div class="loader">Carregando dados...</div>
      </div>

      <!-- Formulário -->
      <form *ngIf="!isLoading" [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="vehicle-form">
        
        <div class="form-grid">
          <!-- Campo Placa -->
          <div class="form-field">
            <tui-textfield>
              <label tuiLabel>Placa</label>
              <input tuiInput formControlName="license_plate" placeholder="Ex: ABC1D23" maxlength="8" style="text-transform: uppercase;" />
            </tui-textfield>
          </div>

          <!-- Campo Ano -->
          <div class="form-field">
            <tui-textfield>
              <label tuiLabel>Ano de Fabricação</label>
              <input tuiInput formControlName="year" type="number" placeholder="Ex: 2024" min="1900" />
            </tui-textfield>
          </div>
        </div>

        <!-- Campo Chassi -->
        <div class="form-field">
          <tui-textfield>
            <label tuiLabel>Chassi</label>
            <input tuiInput formControlName="chassis" placeholder="Digite os 17 caracteres do chassi" maxlength="17" style="text-transform: uppercase;" />
          </tui-textfield>
        </div>

        <!-- Campo Renavam -->
        <div class="form-field">
          <tui-textfield>
            <label tuiLabel>Renavam</label>
            <input tuiInput formControlName="renavam" placeholder="Digite os 11 dígitos do renavam" maxlength="11" />
          </tui-textfield>
        </div>

        <div class="form-grid">
          <!-- Campo Marca (Select Customizado) -->
          <div class="form-field select-field">
            <label class="custom-label">Marca</label>
            <select formControlName="brand_id" (change)="onBrandChange($event)" class="custom-select">
              <option value="" disabled selected>Selecione uma marca</option>
              <option *ngFor="let brand of brands" [value]="brand.id">{{ brand.name }}</option>
            </select>
          </div>

          <!-- Campo Modelo (Select Customizado) -->
          <div class="form-field select-field">
            <label class="custom-label">Modelo</label>
            <select formControlName="model_id" class="custom-select">
              <option value="" disabled>{{ selectedBrandId ? 'Selecione um modelo' : 'Selecione uma marca primeiro' }}</option>
              <option *ngFor="let model of filteredModels" [value]="model.id">{{ model.name }}</option>
            </select>
          </div>
        </div>

        <!-- Alerta de Erro -->
        <div *ngIf="errorMessage" class="error-banner">
          {{ errorMessage }}
        </div>

        <!-- Ações do Formulário -->
        <div class="form-actions">
          <a routerLink="/vehicles" class="cancel-btn">Cancelar</a>
          <button
            tuiButton
            type="submit"
            [disabled]="vehicleForm.invalid || isSaving"
            class="submit-button"
          >
            {{ isSaving ? 'Salvando...' : 'Salvar Veículo' }}
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
